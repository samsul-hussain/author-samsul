<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samsul Hussain · Author & AI Operations Specialist</title>
    <script>
      (function() {
        var path = window.location.pathname;
        if (window.location.hostname.endsWith('github.io')) {
          var segments = path.split('/').filter(Boolean);
          var repo = segments.length > 0 ? '/' + segments[0] + '/' : '/';
          window.location.replace(repo + window.location.hash);
        } else {
          window.location.replace('./' + window.location.hash);
        }
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 60px 20px; color: #334155;">
    <h2 style="font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">Redirecting to Portfolio...</h2>
    <p style="font-size: 14px; color: #64748b;">If you are not redirected in a few seconds, <a href="./" style="color: #4f46e5; text-decoration: underline;">click here to enter</a>.</p>
  </body>
</html>
